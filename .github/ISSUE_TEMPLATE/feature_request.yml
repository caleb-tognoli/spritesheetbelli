name: Feature request
description: An idea for something new or better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or workflow, and what makes it hard today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working. Other tools that do it well are useful examples.
