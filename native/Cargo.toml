[package]
name = "sbelli_native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = { version = "0.5.5", features = ["api-4-7", "experimental-threads"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
	"implement",
	"Win32_Foundation",
	"Win32_Graphics_Gdi",
	"Win32_System_Com",
	"Win32_System_Com_StructuredStorage",
	"Win32_System_DataExchange",
	"Win32_System_Memory",
	"Win32_System_Ole",
	"Win32_System_SystemServices",
	"Win32_UI_Shell",
] }
windows-core = "0.58"

[profile.release]
strip = true
lto = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.14"
