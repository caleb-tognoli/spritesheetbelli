name: Release

# Push a tag like v1.0.0 to build every platform, attach the builds to a GitHub
# release and publish the web version to GitHub Pages. The tag must match the version
# in project.godot and export_presets.cfg, and the release notes are the CHANGELOG.md
# section of that version (see .github/scripts/release_notes.py). Run it by hand to
# get the builds as workflow artifacts without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  native:
    uses: ./.github/workflows/native.yml

  export:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Exports copy them next to the app (inside it on macOS)
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: extension/bin
          merge-multiple: true

      - name: Check the version and write the release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          fail() { echo "::error::$1"; exit 1; }
          grep -qxF "config/version=\"$VERSION\"" project.godot \
            || fail "project.godot's config/version isn't $VERSION"
          for line in "application/file_version=\"$VERSION.0\"" "application/product_version=\"$VERSION.0\"" \
            "application/short_version=\"$VERSION\"" "application/version=\"$VERSION\""; do
            grep -qxF "$line" export_presets.cfg || fail "export_presets.cfg has no $line"
          done
          python3 .github/scripts/release_notes.py "$VERSION" CHANGELOG.md "$GITHUB_REPOSITORY" \
            > release_notes.md || fail "CHANGELOG.md has no \"## $VERSION\" section"

      - name: Cache Godot and export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot and export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cd ~/godot
          curl -sSLo godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          curl -sSLo templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j templates.tpz -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          rm templates.tpz

      - name: Export
        run: |
          export PATH="$HOME/godot:$PATH"
          mkdir -p build/windows build/linux build/macos build/web
          # Keep Godot from importing the exported files
          touch build/.gdignore
          godot --headless --import || true
          godot --headless --export-release "Windows" build/windows/spritesheetbelli.exe
          godot --headless --export-release "Linux" build/linux/spritesheetbelli.x86_64
          godot --headless --export-release "macOS" build/macos/spritesheetbelli.zip
          godot --headless --export-release "Web" build/web/index.html

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          (cd build/windows && zip -q "../../dist/spritesheetbelli-${VERSION}-windows.zip" \
            spritesheetbelli.exe sbelli_native.windows.x86_64.dll)
          # With install.sh, which adds the launcher and the file types
          mkdir -p build/linux/spritesheetbelli
          mv build/linux/spritesheetbelli.x86_64 build/linux/libsbelli_native.linux.x86_64.so \
            build/linux/spritesheetbelli/
          cp packaging/linux/* build/linux/spritesheetbelli/
          cp icon.svg build/linux/spritesheetbelli/spritesheetbelli.svg
          chmod +x build/linux/spritesheetbelli/spritesheetbelli.x86_64 build/linux/spritesheetbelli/install.sh
          tar -czf "dist/spritesheetbelli-${VERSION}-linux.tar.gz" -C build/linux spritesheetbelli
          cp build/macos/spritesheetbelli.zip "dist/spritesheetbelli-${VERSION}-macos.zip"
          (cd build/web && zip -q -r "../../dist/spritesheetbelli-${VERSION}-web.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: builds
          path: dist/

      # For the installer, made on Windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: |
            build/windows/spritesheetbelli.exe
            build/windows/sbelli_native.windows.x86_64.dll

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release-notes
          path: release_notes.md

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  installer:
    # Inno Setup only runs on Windows
    needs: export
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-app
          path: build/windows

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: |
          [ -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ] || choco install innosetup -y --no-progress
          pip install pillow

      # Opens .sbelli projects with the app and offers it for importable files
      - name: Make the installer
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python packaging/windows/wizard_images.py build/wizard
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" -Q "-DVersion=$VERSION" \
            "-DBuild=$PWD/build/windows" "-DImages=$PWD/build/wizard" "-O$PWD/dist" \
            packaging/windows/installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [export, installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: builds
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release_notes.md

  pages:
    # Needs Settings > Pages > Source set to "GitHub Actions"
    if: startsWith(github.ref, 'refs/tags/')
    needs: export
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  itch:
    # Optional: set the repository variable ITCH_GAME (e.g. "your-name/spritesheetbelli")
    # and the secret BUTLER_API_KEY (from https://itch.io/user/settings/api-keys)
    if: startsWith(github.ref, 'refs/tags/') && vars.ITCH_GAME != ''
    needs: export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: builds
          path: dist
      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_GAME: ${{ vars.ITCH_GAME }}
        run: |
          curl -sSLo butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip && chmod +x butler
          VERSION="${GITHUB_REF_NAME#v}"
          ./butler push dist/*-windows.zip "$ITCH_GAME:windows" --userversion "$VERSION"
          ./butler push dist/*-linux.tar.gz "$ITCH_GAME:linux" --userversion "$VERSION"
          ./butler push dist/*-macos.zip "$ITCH_GAME:mac" --userversion "$VERSION"
          ./butler push dist/*-web.zip "$ITCH_GAME:html5" --userversion "$VERSION"

permissions:
  contents: write
